services:
  k1lens:
    build: .
    ports:
      - "8000:8000"
    environment:
      K1LENS_DB: /app/data/k1lens.db
    volumes:
      - k1data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  k1data:
