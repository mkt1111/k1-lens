[project]
name = "k1lens"
version = "0.1.0"
description = "Synthetic Schedule K-1 extraction, validation, human review, and evaluation."
readme = "README.md"
license = "MIT"
authors = [{ name = "Matthew Thornhill" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pillow>=10.4",
    "pydantic>=2.9",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.12",
    "reportlab[accel]>=4.2",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.scripts]
k1lens = "k1lens.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k1lens"
module-root = "src"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["k1lens"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pdfplumber", "pdfplumber.*", "reportlab", "reportlab.*", "pypdfium2", "pypdfium2.*", "pytesseract"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=k1lens --cov-report=term-missing --cov-fail-under=90 --hypothesis-seed=1065"
markers = [
    "slow: tests that render scans or run Tesseract on a page",
]

[tool.coverage.run]
source = ["k1lens"]
branch = false

[tool.coverage.report]
show_missing = true
fail_under = 90
skip_empty = true
